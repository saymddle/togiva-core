<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TOGIVA Core Portal</title>
  <style>
    :root {
      --bg: #f7f7f5; --panel: #ffffff; --text: #1c1d1f; --muted: #5d6066; --line: #e3e3df;
      --accent: #2f5bd3; --accent-soft: #e8eefc; --ok: #1f7a4a; --ok-soft: #e3f4ea; --warn: #8a5a00; --warn-soft: #fbf0d9;
      --code: #f1f1ee;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121315; --panel: #1a1b1e; --text: #e9e9ea; --muted: #a2a5ab; --line: #2c2e33;
        --accent: #8aa9ff; --accent-soft: #1f2a47; --ok: #6fd39c; --ok-soft: #173326; --warn: #f0c060; --warn-soft: #3a2e14; --code: #222428; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--accent); }
    header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
    header .build { color: var(--muted); font-size: 13px; }
    header .spacer { flex: 1; }
    header a.btn { font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 10px; border-radius: 8px; background: var(--accent-soft); }
    .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1240px; margin: 0 auto; }
    nav { padding: 16px; border-right: 1px solid var(--line); min-height: calc(100vh - 54px); }
    nav a { display: block; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--text); font-size: 14px; }
    nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    nav .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 10px 6px; }
    main { padding: 24px 32px 64px; min-width: 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 16px 0 28px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .card .k { font-size: 13px; color: var(--muted); }
    .card .v { font-size: 22px; font-weight: 700; }
    .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
    .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
    .commits { list-style: none; padding: 0; margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .commits li { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 12px; flex-wrap: wrap; }
    .commits li:first-child { border-top: 0; }
    .commits code { color: var(--muted); }
    .commits time { color: var(--muted); font-size: 13px; margin-left: auto; }
    .doc { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 28px 28px; }
    .doc table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-size: 14px; }
    .doc th, .doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
    .doc th { background: var(--code); }
    .doc code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
    .doc pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
    .doc pre code { background: none; padding: 0; }
    .doc h1 { font-size: 28px; } .doc h2 { margin-top: 32px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .mermaid { background: #fff; border-radius: 8px; padding: 8px; overflow-x: auto; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      nav { min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 4px; padding: 8px 16px; }
      nav .label { display: none; } nav a { white-space: nowrap; }
      main { padding: 16px; } .doc { padding: 4px 16px 20px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>TOGIVA Core</h1>
    <span class="build" id="build"></span>
    <span class="spacer"></span>
    <a class="btn" href="/api">API reference</a>
    <a class="btn" id="repo" href="#">GitHub</a>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
  <script>/*__DATA__*/</script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    const { docs, commits, build } = window.PORTAL;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    $("build").textContent = `${build.branch} @ ${build.sha} · built ${new Date(build.builtAt).toLocaleString()}`;
    $("repo").href = `https://github.com/${build.repo}`;
    if (window.mermaid) mermaid.initialize({ startOnLoad: false, theme: "default" });

    function renderNav(active) {
      $("nav").innerHTML = `<div class="label">Overview</div><a href="#/" class="${active === "" ? "active" : ""}">Progress</a>
        <div class="label">Documents</div>` +
        docs.map((d) => `<a href="#/${d.id}" class="${active === d.id ? "active" : ""}">${esc(d.title)}</a>`).join("");
    }

    function statusCounts() {
      const status = docs.find((d) => d.id === "IMPLEMENTATION_STATUS")?.md ?? "";
      const count = (ch) => (status.match(new RegExp(`\\|\\s*${ch}`, "g")) || []).length;
      const tests = status.match(/\*\*(\d+) passed, (\d+) failed\*\*/);
      const updated = status.match(/Last updated: ([^\n(]+)/);
      return { done: count("✅"), pending: count("🟨"), notStarted: count("⬜"), passed: tests?.[1], failed: tests?.[2], updated: updated?.[1]?.trim() };
    }

    function home() {
      const s = statusCounts();
      const recent = commits.length
        ? `<ul class="commits">${commits.map((c) => `<li><code>${esc(c.sha)}</code><span>${esc(c.subject)}</span><time>${new Date(c.date).toLocaleString()}</time></li>`).join("")}</ul>`
        : `<p>Commit history isn't available in this build.</p>`;
      return `<h2>Progress</h2>
        <p>This page rebuilds on every push to the repository, so it always reflects the branch shown at the top.</p>
        <div class="cards">
          <div class="card"><div class="k">Areas implemented and tested</div><div class="v">${s.done}</div><span class="pill ok">done</span></div>
          <div class="card"><div class="k">Schema/contract ready, code pending</div><div class="v">${s.pending}</div><span class="pill warn">next</span></div>
          <div class="card"><div class="k">Not started</div><div class="v">${s.notStarted}</div></div>
          <div class="card"><div class="k">Automated tests</div><div class="v">${s.passed ?? "?"} passed</div><span class="pill ${s.failed === "0" ? "ok" : "warn"}">${s.failed ?? "?"} failed</span></div>
        </div>
        <p>Status document last updated: <strong>${esc(s.updated ?? "unknown")}</strong> · <a href="#/IMPLEMENTATION_STATUS">Read the full status</a> · <a href="/api">Browse the API</a></p>
        <h2>Recent changes</h2>${recent}`;
    }

    async function route() {
      const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
      renderNav(id);
      const doc = docs.find((d) => d.id === id);
      if (!doc) { $("main").innerHTML = home(); return; }
      const html = window.marked ? marked.parse(doc.md) : `<pre>${esc(doc.md)}</pre>`;
      $("main").innerHTML = `<article class="doc">${html}</article>`;
      document.querySelectorAll("pre code.language-mermaid").forEach((el) => {
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = el.textContent;
        el.parentElement.replaceWith(div);
      });
      if (window.mermaid) await mermaid.run({ querySelector: ".mermaid" }).catch(() => {});
      window.scrollTo(0, 0);
    }
    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
